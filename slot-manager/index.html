<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Slot Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4BBB2A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slot Manager">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#4BBB2A;--on-g:#122008;--bg:#ffffff;--card:#f5f6f5;--panel:#f8f9f8;--inp:#ffffff;--bdr:#dcdcdc;--gr:#666;--wh:#1a1a1a;--rd:#d32f2f;--ok:#1f8a2e}
body{background:var(--bg);color:var(--wh);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{background:#fff;border-bottom:2px solid #eaeaea;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.logo{width:38px;height:38px;background:var(--g);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--on-g)}
.header h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px}
.header p{font-size:11px;color:var(--gr)}
.refresh-btn{margin-left:auto;background:transparent;border:1px solid var(--bdr);color:var(--gr);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.refresh-btn:hover{border-color:var(--g);color:var(--g)}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px 60px}

/* PIN GATE */
#gate{display:flex;min-height:80vh;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#gate input{background:var(--inp);border:2px solid var(--bdr);border-radius:12px;padding:16px;font-size:22px;letter-spacing:6px;text-align:center;width:220px;margin:18px 0 12px;outline:none}
#gate input:focus{border-color:var(--g)}
#gate button{background:var(--g);border:none;color:var(--on-g);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:1px;padding:14px 30px;border-radius:12px;cursor:pointer}
#gate .err{color:var(--rd);font-size:13px;margin-top:10px;min-height:18px}

/* MAIN APP */
#app{display:none}
.city-tabs{display:flex;gap:8px;margin-bottom:18px}
.city-tab{flex:1;padding:12px;border-radius:10px;border:2px solid var(--bdr);background:var(--card);color:var(--gr);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:1px;cursor:pointer;text-align:center}
.city-tab.active{border-color:var(--g);color:var(--wh);background:rgba(75,187,42,.12)}
.status-line{font-size:12px;color:var(--gr);margin-bottom:16px;text-align:center}
.grid{display:flex;flex-direction:column;gap:10px}
.slot-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.slot-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--g);width:34px;text-align:center;flex-shrink:0}
.slot-mid{flex:1;min-width:0}
.slot-name{font-weight:800;font-size:14px}
.slot-price{font-size:12px;color:var(--gr)}
.swatches{display:flex;gap:5px;margin-top:6px}
.sw{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bdr);position:relative}
.sw.filled{border-color:var(--g)}
.sw.filled::after{content:"";position:absolute;inset:2px;background:var(--g);border-radius:50%}
.edit-btn{background:var(--g);border:none;color:var(--on-g);font-weight:800;font-size:12px;padding:10px 14px;border-radius:9px;cursor:pointer;flex-shrink:0;font-family:'Inter',sans-serif}

/* EDIT MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;padding:16px;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-card{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:22px;max-height:88vh;overflow:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;color:var(--g)}
.modal-sub{font-size:12px;color:var(--gr);margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:10px;color:var(--gr);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.field input{background:var(--inp);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;font-size:15px;font-family:'Inter',sans-serif;outline:none}
.field input:focus{border-color:var(--g)}
.color-wrap{display:flex;gap:8px;flex-wrap:wrap}
.color-chip{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);background:var(--card);color:var(--gr)}
.color-chip.sel{background:var(--g);color:var(--on-g);border-color:var(--g)}
.preview{display:none;margin-top:10px;text-align:center;background:var(--panel);border:1px solid var(--bdr);border-radius:10px;padding:10px}
.preview.show{display:block}
.preview img{max-width:100%;max-height:220px;border-radius:8px;background:#fff}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:14px;border-radius:10px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;border:none}
.btn-cancel{background:var(--card);border:1px solid var(--bdr) !important;color:var(--wh)}
.btn-save{background:var(--g);color:var(--on-g)}
.save-status{font-size:12px;margin-top:10px;text-align:center;min-height:16px}
.save-status.ok{color:var(--ok);font-weight:700}
.save-status.err{color:var(--rd);font-weight:700}
.live-link{display:block;text-align:center;font-size:11px;color:var(--gr);margin-top:8px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">SG</div>
  <div><h1>SLOT MANAGER</h1><p>Top 10 Tees — private tool</p></div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadLiveData()" style="display:none">↻ Refresh</button>
</div>

<div id="gate">
  <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px">Enter PIN</div>
  <p style="color:var(--gr);font-size:13px;margin-top:6px">Same PIN as your Top 10 Tees admin panel</p>
  <input type="password" id="pin-input" inputmode="numeric" maxlength="10" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPin()"/>
  <button onclick="checkPin()">UNLOCK</button>
  <div class="err" id="pin-err"></div>
</div>

<div class="wrap" id="app">
  <div class="city-tabs">
    <div class="city-tab active" id="tab-boston" onclick="setCity('boston')">BOSTON</div>
    <div class="city-tab" id="tab-detroit" onclick="setCity('detroit')">DETROIT</div>
  </div>
  <div class="status-line" id="status-line">Loading current slots…</div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-title" id="modal-title">Slot</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="field"><label>Product Name</label><input type="text" id="f-name" placeholder="e.g. Rozzie Rebels"/></div>
    <div class="field"><label>Description (optional)</label><input type="text" id="f-desc" placeholder="Short description shown on the product page"/></div>
    <div class="field"><label>Price ($)</label><input type="number" step="0.01" id="f-price" placeholder="30"/></div>
    <div class="field">
      <label>Photo Color <span style="color:var(--g)">*</span></label>
      <div class="color-wrap" id="color-chips"></div>
    </div>
    <div class="field">
      <label>Upload Photo</label>
      <input type="file" id="f-photo" accept="image/png,image/jpeg,image/webp" onchange="previewPhoto(this)"/>
    </div>
    <div class="preview" id="preview"><img id="preview-img" alt="Preview"/></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveSlot()">Save & Go Live</button>
    </div>
    <div class="save-status" id="save-status"></div>
    <a class="live-link" href="https://tshirtsbysg-top10.netlify.app" target="_blank" rel="noopener">Open live site to confirm →</a>
  </div>
</div>

<script>
const WEBHOOK_URL="https://script.google.com/macros/s/AKfycbx71B49y21pMJU6n_33IqahGuGxL_WjKAtRgLfA2k2oL7PXTPYa4_Khv5P2mDPXVWeC3A/exec";
const ADMIN_PIN="239367";
const COLORS=["Black","White","Red","Gray","Blue"];
const SLOT_IDS={
  boston:["T1001","T1002","T1003","T1004","T1005","T1006","T1007","T1008","T1009","T1010"],
  detroit:["D1001","D1002","D1003","D1004","D1005","D1006","D1007","D1008","D1009","D1010"]
};
const DEFAULT_NAME_PREFIX={boston:"TOP TEN DESIGN ",detroit:"TOP TEN DETROIT "};

let currentCity="boston";
let liveSettings=null;   // last-fetched full settings object from the Sheet — never hand-built, always read-then-merged
let photoMap={};         // key "T1004::Black" -> dataUrl (truthy = filled)
let editingId=null;
let pendingPhotoDataUrl=null;
let pendingColor=null;

function checkPin(){
  const v=document.getElementById("pin-input").value.trim();
  if(v===ADMIN_PIN){
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("refresh-btn").style.display="inline-block";
    loadLiveData();
  }else{
    document.getElementById("pin-err").textContent="Incorrect PIN.";
  }
}

async function loadLiveData(){
  document.getElementById("status-line").textContent="Loading current slots…";
  try{
    const [settingsRes,photosRes]=await Promise.all([
      fetch(`${WEBHOOK_URL}?type=settings`).then(r=>r.json()).catch(()=>null),
      fetch(`${WEBHOOK_URL}?type=photos`).then(r=>r.json()).catch(()=>null)
    ]);
    liveSettings=settingsRes&&typeof settingsRes==="object"?settingsRes:{};
    liveSettings.prices=liveSettings.prices||{};
    liveSettings.names=liveSettings.names||{};
    liveSettings.descriptions=liveSettings.descriptions||{};
    photoMap=photosRes&&typeof photosRes==="object"?photosRes:{};
    document.getElementById("status-line").textContent="Live data loaded — showing what's actually on your site right now.";
  }catch(e){
    document.getElementById("status-line").textContent="Couldn't reach your Google Sheet. Check your connection and hit Refresh.";
    liveSettings=liveSettings||{prices:{},names:{}};
  }
  renderGrid();
}

function setCity(city){
  currentCity=city;
  document.getElementById("tab-boston").classList.toggle("active",city==="boston");
  document.getElementById("tab-detroit").classList.toggle("active",city==="detroit");
  renderGrid();
}

function slotNameFor(id,index){
  const saved=liveSettings.names&&liveSettings.names[id];
  if(saved)return saved;
  return `${DEFAULT_NAME_PREFIX[currentCity]}${String(index+1).padStart(2,"0")}`;
}
function slotPriceFor(id){
  const saved=liveSettings.prices&&liveSettings.prices[id];
  return typeof saved==="number"?saved:30;
}

function renderGrid(){
  const grid=document.getElementById("grid");
  const ids=SLOT_IDS[currentCity];
  grid.innerHTML=ids.map((id,i)=>{
    const name=slotNameFor(id,i);
    const price=slotPriceFor(id);
    const swatches=COLORS.map(c=>{
      const filled=!!photoMap[`${id}::${c}`];
      return `<div class="sw${filled?" filled":""}" title="${c}${filled?" — has photo":" — empty"}"></div>`;
    }).join("");
    return `<div class="slot-card">
      <div class="slot-num">${i+1}</div>
      <div class="slot-mid">
        <div class="slot-name">${escapeHtml(name)}</div>
        <div class="slot-price">$${price.toFixed?price.toFixed(2):price}</div>
        <div class="swatches">${swatches}</div>
      </div>
      <button class="edit-btn" onclick="openModal('${id}',${i})">Fill / Edit</button>
    </div>`;
  }).join("");
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function openModal(id,index){
  editingId=id;
  pendingPhotoDataUrl=null;
  pendingColor=null;
  document.getElementById("modal-title").textContent=`${currentCity==="boston"?"Boston":"Detroit"} — Slot ${index+1} (${id})`;
  document.getElementById("modal-sub").textContent="Leave Name or Price blank to keep the current value. Pick a color before saving a photo.";
  document.getElementById("f-name").value=slotNameFor(id,index);
  document.getElementById("f-desc").value=(liveSettings.descriptions&&liveSettings.descriptions[id])||"";
  document.getElementById("f-price").value=slotPriceFor(id);
  document.getElementById("f-photo").value="";
  document.getElementById("preview").classList.remove("show");
  document.getElementById("save-status").textContent="";
  document.getElementById("save-status").className="save-status";
  const cc=document.getElementById("color-chips");
  cc.innerHTML=COLORS.map(c=>{
    const filled=!!photoMap[`${id}::${c}`];
    return `<div class="color-chip" data-color="${c}" onclick="pickColor('${c}')">${c}${filled?" ✓":""}</div>`;
  }).join("");
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show");editingId=null;}

function pickColor(c){
  pendingColor=c;
  document.querySelectorAll(".color-chip").forEach(el=>el.classList.toggle("sel",el.dataset.color===c));
}

function previewPhoto(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  compressImage(file).then(dataUrl=>{
    pendingPhotoDataUrl=dataUrl;
    document.getElementById("preview-img").src=dataUrl;
    document.getElementById("preview").classList.add("show");
  }).catch(()=>alert("Could not read that photo — try another file."));
}

// Identical compression approach to the live storefront's own uploader, so file sizes stay
// within what Google Sheets/Apps Script can reliably store.
function compressImage(file,opts){
  opts=opts||{};
  const maxCharsTarget=opts.maxChars||42000;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let dim=800,q=0.75,tries=0;
        function attempt(){
          const scale=Math.min(1,dim/Math.max(img.width,img.height));
          const cw=Math.max(1,Math.round(img.width*scale)),ch=Math.max(1,Math.round(img.height*scale));
          const canvas=document.createElement("canvas");
          canvas.width=cw;canvas.height=ch;
          const ctx=canvas.getContext("2d");
          ctx.fillStyle="#ffffff";ctx.fillRect(0,0,cw,ch);
          ctx.drawImage(img,0,0,cw,ch);
          const dataUrl=canvas.toDataURL("image/jpeg",q);
          tries++;
          if(dataUrl.length<=maxCharsTarget||tries>=7){resolve(dataUrl)}
          else{q=Math.max(0.3,q-0.12);dim=Math.max(280,dim-120);attempt()}
        }
        attempt();
      };
      img.onerror=()=>reject(new Error("Could not read image"));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

async function saveSlot(){
  if(!editingId)return;
  const nameVal=document.getElementById("f-name").value.trim();
  const descVal=document.getElementById("f-desc").value.trim();
  const priceVal=document.getElementById("f-price").value.trim();
  if(pendingPhotoDataUrl&&!pendingColor){
    setStatus("Pick which color this photo is for before saving.","err");
    return;
  }
  const btn=document.getElementById("save-btn");
  btn.disabled=true;btn.textContent="Saving…";
  setStatus("Reading current live data so nothing else gets overwritten…","");

  // Re-fetch fresh settings right before writing — settings are saved as a FULL snapshot,
  // so we always merge into the latest live copy rather than a possibly-stale one.
  let fresh;
  try{
    fresh=await fetch(`${WEBHOOK_URL}?type=settings`).then(r=>r.json());
    if(!fresh||typeof fresh!=="object")throw new Error("empty");
  }catch(e){
    setStatus("Couldn't reach your Google Sheet to save safely. Check your connection and try again.","err");
    btn.disabled=false;btn.textContent="Save & Go Live";
    return;
  }
  fresh.prices=fresh.prices||{};
  fresh.names=fresh.names||{};
  fresh.descriptions=fresh.descriptions||{};
  if(nameVal)fresh.names[editingId]=nameVal;
  fresh.descriptions[editingId]=descVal;
  if(priceVal!==""&&!isNaN(parseFloat(priceVal))&&parseFloat(priceVal)>=0)fresh.prices[editingId]=parseFloat(priceVal);

  try{
    await fetch(WEBHOOK_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({type:"settings",settings:fresh})});
  }catch(e){
    setStatus("Name/price save failed to send — check your connection.","err");
    btn.disabled=false;btn.textContent="Save & Go Live";
    return;
  }

  if(pendingPhotoDataUrl&&pendingColor){
    setStatus("Name/price sent. Uploading photo…","");
    try{
      await fetch(WEBHOOK_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({type:"photo",key:`${editingId}::${pendingColor}`,dataUrl:pendingPhotoDataUrl})});
      photoMap[`${editingId}::${pendingColor}`]=pendingPhotoDataUrl;
    }catch(e){
      setStatus("Name/price saved, but the photo failed to send. Try the photo again.","err");
      btn.disabled=false;btn.textContent="Save & Go Live";
      return;
    }
  }

  // Update local view optimistically. Because these POSTs use no-cors, the browser can't
  // read a real success/failure response — this reflects what we SENT, not a confirmed receipt.
  liveSettings=fresh;
  renderGrid();
  setStatus("Sent — check the live site link below in a few seconds to confirm it shows up.","ok");
  btn.disabled=false;btn.textContent="Save & Go Live";
}

function setStatus(msg,cls){
  const el=document.getElementById("save-status");
  el.textContent=msg;
  el.className="save-status"+(cls?" "+cls:"");
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{/* install-as-app just won't be offered; the tool still works fine in-browser */})});
}
</script>
</body>
</html>
